<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <style>
      :root {
        --bg:#eef1f6; --surface:#fff; --ink:#1b2430; --muted:#66758a; --line:#dde3ec;
        --accent:#3b5bdb; --accent-soft:#e7ecff; --high:#c92a2a; --med:#a8690f; --low:#4c6a92; --ok:#2b8a3e;
      }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
      main { max-width:720px; margin:0 auto; padding:28px 16px 72px; }
      h1,h2,h3 { margin:0; line-height:1.25; }
      button, input, select { font:inherit; color:inherit; }
      button { cursor:pointer; }
      :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

      .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.25rem; letter-spacing:-.01em; }
      .mark { width:26px; height:26px; border-radius:8px; background:var(--accent); position:relative; }
      .mark::after { content:""; position:absolute; left:7px; top:5px; width:7px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(40deg); }

      header.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
      .who { display:flex; align-items:center; gap:10px; }
      .avatar { width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; }
      .who small { display:block; color:var(--muted); line-height:1.2; }
      .linkbtn { background:none; border:0; color:var(--muted); padding:6px 8px; border-radius:6px; }
      .linkbtn:hover { color:var(--ink); background:#e3e8f0; }

      .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
      .panel h2 { font-size:1rem; margin-bottom:12px; }

      /* sign in */
      .auth { max-width:400px; margin:9vh auto 0; }
      .auth .brand { justify-content:center; margin-bottom:6px; }
      .auth p.lead { text-align:center; color:var(--muted); margin:0 0 20px; }
      .tabs { display:grid; grid-template-columns:1fr 1fr; background:#e9edf4; border-radius:10px; padding:4px; margin-bottom:16px; }
      .tabs button { border:0; background:none; padding:8px; border-radius:7px; color:var(--muted); font-weight:600; }
      .tabs button[aria-selected="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(20,30,50,.12); }
      label.field { display:block; margin-bottom:12px; font-size:.9rem; font-weight:600; }
      label.field input { display:block; width:100%; margin-top:4px; }
      input[type=text], input[type=password], input[type=date], input:not([type]) {
        padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; min-width:0; }
      input:focus { border-color:var(--accent); }
      .primary { background:var(--accent); color:#fff; border:0; border-radius:9px; padding:10px 18px; font-weight:600; }
      .primary:hover { filter:brightness(1.08); }
      .primary.block { width:100%; margin-top:4px; }
      .msg { color:var(--high); margin:12px 0 0; font-size:.92rem; }

      /* add task */
      .add input.title { width:100%; font-size:1.05rem; padding:12px 14px; }
      .add .opts { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
      .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
      .seg button { border:0; background:#fff; padding:8px 12px; color:var(--muted); }
      .seg button + button { border-left:1px solid var(--line); }
      .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
      .add .spacer { flex:1; }

      /* progress */
      .progress-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
      .bar { height:10px; background:#e9edf4; border-radius:99px; overflow:hidden; }
      .bar > i { display:block; height:100%; background:var(--ok); border-radius:99px; transition:width .3s; }
      .muted { color:var(--muted); font-size:.9rem; }
      .late-note { color:var(--high); font-weight:600; }

      /* tasks */
      ul.tasks { list-style:none; margin:0; padding:0; }
      .task { display:flex; align-items:center; gap:14px; padding:12px 6px 12px 12px; border-bottom:1px solid var(--line); border-left:4px solid var(--low); }
      .task:last-child { border-bottom:0; }
      .task.MEDIUM { border-left-color:var(--med); } .task.HIGH { border-left-color:var(--high); }
      .check { width:26px; height:26px; flex:none; border-radius:50%; border:2px solid #b8c3d4; background:#fff; color:#fff; display:grid; place-items:center; font-size:.85rem; line-height:1; }
      .check:hover:not(:disabled) { border-color:var(--ok); }
      .task.done .check { background:var(--ok); border-color:var(--ok); cursor:default; }
      .body { flex:1; min-width:0; }
      .title { display:block; overflow-wrap:anywhere; }
      .task.done .title { color:var(--muted); text-decoration:line-through; }
      .meta { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--muted); font-size:.85rem; }
      .prio { font-weight:600; } .prio.HIGH { color:var(--high); } .prio.MEDIUM { color:var(--med); } .prio.LOW { color:var(--low); }
      .due.late { color:var(--high); font-weight:600; }
      .remove { background:none; border:0; color:var(--muted); padding:6px 10px; border-radius:6px; }
      .remove:hover { color:var(--high); background:#fdeeee; }
      .empty { text-align:center; color:var(--muted); padding:28px 8px; }

      table { width:100%; border-collapse:collapse; }
      th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); }
      th { color:var(--muted); font-weight:600; font-size:.9rem; }
      tr:last-child td { border-bottom:0; }

      @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
